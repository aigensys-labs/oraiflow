<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" fill="none">
  <title>Digital Ledger</title>
  <desc>Abstract financial ledger visualization with layered transaction panels, precision lines and rising data bars.</desc>
  <defs>
    <linearGradient id="bg" x1="40" y1="20" x2="1540" y2="600" gradientUnits="userSpaceOnUse"><stop stop-color="#08182B"/><stop offset=".52" stop-color="#10253A"/><stop offset="1" stop-color="#1A2942"/></linearGradient>
    <radialGradient id="warm" cx="0" cy="0" r="1" gradientTransform="matrix(-230 260 -350 -310 1250 250)" gradientUnits="userSpaceOnUse"><stop stop-color="#D6A75F" stop-opacity=".22"/><stop offset="1" stop-color="#D6A75F" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#75D8E0" stop-opacity=".56"/><stop offset="1" stop-color="#E5B66F" stop-opacity=".24"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1A3A54" stop-opacity=".94"/><stop offset="1" stop-color="#12243A" stop-opacity=".92"/></linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" stroke="#B6D7E5" stroke-opacity=".055"/></pattern>
    <filter id="shadow" x="650" y="20" width="840" height="570"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <path fill="url(#bg)" d="M0 0h1600v600H0z"/><path fill="url(#grid)" d="M0 0h1600v600H0z"/><path fill="url(#warm)" d="M0 0h1600v600H0z"/>
  <g opacity=".55" stroke="#7FDCE5" stroke-width="1"><path d="M0 470h1600M0 500h1600M0 530h1600" stroke-opacity=".12"/><path d="M720 0v600M780 0v600M840 0v600" stroke-opacity=".07"/></g>
  <ellipse cx="1110" cy="310" rx="290" ry="210" fill="#D9A95F" fill-opacity=".12" filter="url(#shadow)"/>
  <g transform="translate(770 94)"><rect x="40" y="44" width="500" height="360" rx="28" fill="#050F1E" fill-opacity=".45" stroke="#76DCE5" stroke-opacity=".24" transform="rotate(-5 40 44)"/><rect x="18" y="18" width="500" height="360" rx="28" fill="url(#card)" stroke="url(#edge)" stroke-width="2"/><path d="M18 94h500" stroke="#8BDCE3" stroke-opacity=".27" stroke-width="2"/>
    <g fill="#D5EAF0"><rect x="54" y="49" width="150" height="10" rx="5" fill-opacity=".76"/><rect x="54" y="117" width="112" height="7" rx="3.5" fill-opacity=".35"/><rect x="54" y="160" width="190" height="7" rx="3.5" fill-opacity=".25"/><rect x="54" y="203" width="150" height="7" rx="3.5" fill-opacity=".25"/><rect x="54" y="246" width="174" height="7" rx="3.5" fill-opacity=".25"/></g>
    <g stroke="#6BD8DF" stroke-opacity=".5"><path d="M54 143h418M54 186h418M54 229h418M54 272h418"/></g>
    <g fill="#73E0D3"><circle cx="450" cy="120" r="7"/><circle cx="450" cy="163" r="7"/><circle cx="450" cy="206" r="7"/><circle cx="450" cy="249" r="7"/></g>
    <g transform="translate(54 304)"><rect width="416" height="48" rx="12" fill="#0B1C2D" stroke="#D8B16F" stroke-opacity=".55"/><path d="M22 24h105m17 0h105m17 0h105" stroke="#E3BF82" stroke-width="4" stroke-linecap="round" stroke-opacity=".7"/><circle cx="386" cy="24" r="7" fill="#E3BF82"/></g>
