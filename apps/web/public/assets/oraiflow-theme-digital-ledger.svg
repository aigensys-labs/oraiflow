  <g stroke="#84DCE5" stroke-opacity=".35" stroke-width="1.5"><path d="M600 124 690 170l-42 75M620 390l84-60 66 66M1220 490l90-55 80 28"/><circle cx="600" cy="124" r="5"/><circle cx="620" cy="390" r="5"/><circle cx="1220" cy="490" r="5"/></g>
