name: "✨ Feature request"
description: "Suggest an improvement to the ORAIflow demo framework."
title: "✨ [Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem or opportunity. Requests should fit ORAIflow's synthetic-data demo and reference-framework scope.
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      placeholder: I expected to be able to ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      validations:
        required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: boundaries
    attributes:
      label: Data, security or architecture considerations
      description: Note any effect on synthetic data, authorization, workflow ownership or demo operation.
    validations:
      required: false
